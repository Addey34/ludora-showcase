<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ludora — Browser Gaming Platform</title>
  <desc id="desc">A dark navy showcase banner with cyan and indigo highlights for Ludora.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#11163a"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#cyan)"/>
  <rect width="1200" height="360" rx="28" fill="url(#violet)"/>

  <g opacity="0.14" stroke="#dbeafe" stroke-width="1">
    <path d="M0 74H1200M0 146H1200M0 218H1200M0 290H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <g transform="translate(76 68)">
    <text x="0" y="32" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">BROWSER GAMING PLATFORM</text>
    <text x="0" y="112" fill="url(#brand)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">LUDORA</text>
    <text x="0" y="158" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">Play instantly. No download. One connected game library.</text>

    <g transform="translate(0 205)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
      <rect x="0" y="0" width="126" height="38" rx="19" fill="#0f2436" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="63" y="25" fill="#67e8f9" text-anchor="middle">TypeScript</text>

      <rect x="144" y="0" width="118" height="38" rx="19" fill="#121d42" stroke="#6366f1" stroke-opacity="0.65"/>
      <text x="203" y="25" fill="#a5b4fc" text-anchor="middle">Nakama</text>

      <rect x="280" y="0" width="112" height="38" rx="19" fill="#0f2436" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="336" y="25" fill="#67e8f9" text-anchor="middle">Realtime</text>

      <rect x="410" y="0" width="88" height="38" rx="19" fill="#121d42" stroke="#6366f1" stroke-opacity="0.65"/>
      <text x="454" y="25" fill="#a5b4fc" text-anchor="middle">PWA</text>
    </g>
  </g>

  <g transform="translate(908 78)">
    <rect x="0" y="0" width="206" height="206" rx="44" fill="#091524" stroke="#334155"/>
    <rect x="22" y="22" width="72" height="72" rx="20" fill="#0f2f3d" stroke="#22d3ee"/>
    <rect x="112" y="22" width="72" height="72" rx="20" fill="#1b214f" stroke="#6366f1"/>
    <rect x="22" y="112" width="72" height="72" rx="20" fill="#1b214f" stroke="#6366f1"/>
    <rect x="112" y="112" width="72" height="72" rx="20" fill="#0f2f3d" stroke="#22d3ee"/>
    <circle cx="58" cy="58" r="11" fill="#67e8f9"/>
    <path d="M137 47h22M148 36v22" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round"/>
    <path d="M46 148h24M58 136v24" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="139" cy="139" r="7" fill="#67e8f9"/>
    <circle cx="158" cy="158" r="7" fill="#67e8f9"/>
  </g>
</svg>